# 由统一源生成，请勿手工修改；改动请在 source/ 中进行后重新生成。
# 统一源版本 2026.09.23-2；目标：mihomo v1.19.x（依据 v1.19.31 源码核对；empty-fallback 等字段在更早内核中会被忽略）
# 产物类型：mihomo 内核直接运行（含端口、控制面、TUN 开关）
# ⚠ 使用前必须把 proxy-providers 里的 url 换成你的订阅链接（当前是占位符，不可直接使用）。

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
external-controller: 127.0.0.1:9090
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack: ['any:53', 'tcp://any:53']
  strict-route: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter: ['geosite:private', +.lan, +.local, +.localdomain, +.home.arpa, +.msftconnecttest.com, +.msftncsi.com, captive.apple.com, localhost.ptlogin2.qq.com, +.pool.ntp.org, time.apple.com, time.windows.com, +.cmpassport.com, +.jegotrip.com.cn, +.icitymobile.mobi, id6.me]
  respect-rules: true
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']
  direct-nameserver: ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']
  nameserver: ['https://1.1.1.1/dns-query', 'https://8.8.8.8/dns-query']
  nameserver-policy:
    geosite:cn,private: ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain: [+.push.apple.com, Mijia Cloud]

proxy-providers:
  订阅1:
    type: http
    url: https://REPLACE-ME.invalid/请替换为你的订阅链接
    path: ./proxy_providers/sub1.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: '204'
      interval: 600
      timeout: 5000
      lazy: true

proxy-groups:
  # 国外默认：独立选择组，成员为七个地区入口，首次默认日本；所选地区全组不可用时不自动跨国
  - name: 国外默认
    type: select
    proxies: [日本, 香港, 韩国, 台湾, 新加坡, 美国, 其他地区]
  - name: OpenAI
    type: select
    proxies: [日本, 国外默认, 香港, 韩国, 台湾, 新加坡, 美国, 其他地区, DIRECT]
  - name: Claude
    type: select
    proxies: [日本, 国外默认, 香港, 韩国, 台湾, 新加坡, 美国, 其他地区, DIRECT]
