  # 远程控制：目前唯一有官方依据的端点是 Cursor Grok Bot 托管计算机（*.cursorvm.com）；直连可用性未实测，所以默认不设 DIRECT
  - name: 远程控制
    type: select
    proxies: [日本, 国外默认, 香港, 韩国, 台湾, 新加坡, 美国, 其他地区, DIRECT]
  # PayPal：DIRECT 仅供明确手动选择；选普通地区入口会继承该入口当前模式，可能自动换节点
  - name: PayPal
    type: select
    proxies: [PayPal·美国固定, 美国, 香港, 日本, 韩国, 台湾, 新加坡, 其他地区, DIRECT]
  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
  - name: 国内直连
    type: select
    proxies: [DIRECT, 国外默认]
  # PayPal·美国固定：尚未指定固定节点：在美国节点中手动选一个；被选节点删除后会回到本组第一个美国节点（见已知限制）
  - name: PayPal·美国固定
    type: select
    include-all-providers: true
    filter: (?i)(🇺🇸|美国|美國|美西|美东|美東|洛杉矶|圣何塞|西雅图|芝加哥|纽约|硅谷|(?<![A-Za-z])USA?(?![A-Za-z])|United\s?States|America|Los\s?Angeles|San\s?Jose|Seattle|Silicon\s?Valley)
    exclude-filter: (?i)(剩余|流量|到期|过期|官网|官方|网址|套餐|重置|客服|Expire|Traffic|Remaining|Reset)
    empty-fallback: REJECT
  # Netflix·解锁入口：尚无解锁验证记录：暂按地区选择，默认国外默认；普通测速通过不代表解锁
