  # 美国：地区入口：选择本地区的工作模式，不跨国
  - name: 美国
    type: select
    proxies: [美国·手动优先, 美国·手动, 美国·自动, 美国·故障转移, 美国·负载均衡]
  # 其他地区：纯手动；不提供跨国自动模式
  - name: 其他地区
    type: select
    include-all-providers: true
    exclude-filter: (?i)(🇭🇰|香港|港|(?<![A-Za-z])HKG?(?![A-Za-z])|Hong\s?Kong)`(?i)(🇯🇵|日本|东京|東京|大阪|埼玉|(?<![A-Za-z])JPN?(?![A-Za-z])|Japan|Tokyo|Osaka)`(?i)(🇰🇷|韩国|韓國|首尔|春川|(?<![A-Za-z])(?:KR|KOR)(?![A-Za-z])|Korea|Seoul)`(?i)(🇹🇼|台湾|台灣|臺灣|台北|新北|彰化|(?<![A-Za-z])TWN?(?![A-Za-z])|Taiwan|Taipei)`(?i)(🇸🇬|新加坡|狮城|獅城|(?<![A-Za-z])SGP?(?![A-Za-z])|Singapore)`(?i)(🇺🇸|美国|美國|美西|美东|美東|洛杉矶|圣何塞|西雅图|芝加哥|纽约|硅谷|(?<![A-Za-z])USA?(?![A-Za-z])|United\s?States|America|Los\s?Angeles|San\s?Jose|Seattle|Silicon\s?Valley)`(?i)(剩余|流量|到期|过期|官网|官方|网址|套餐|重置|客服|Expire|Traffic|Remaining|Reset)
    empty-fallback: REJECT
  # 香港·手动优先：手动优先·自动兜底：手选节点健康检查失败时用同地区自动测速，恢复后切回
  - name: 香港·手动优先
    type: fallback
    proxies: [香港·手动, 香港·自动]
    url: https://www.gstatic.com/generate_204
    expected-status: '204'
    interval: 300
    timeout: 5000
    lazy: true
    max-failed-times: 3
    hidden: true
  # 香港·手动：纯手动：在本地区节点中选择
  - name: 香港·手动
    type: select
    include-all-providers: true
    filter: (?i)(🇭🇰|香港|港|(?<![A-Za-z])HKG?(?![A-Za-z])|Hong\s?Kong)
    exclude-filter: (?i)(剩余|流量|到期|过期|官网|官方|网址|套餐|重置|客服|Expire|Traffic|Remaining|Reset)
    empty-fallback: REJECT
  # 香港·自动：自动测速：同地区延迟最低（不代表带宽 / 解锁 / IP 信誉）
  - name: 香港·自动
    type: url-test
    include-all-providers: true
    filter: (?i)(🇭🇰|香港|港|(?<![A-Za-z])HKG?(?![A-Za-z])|Hong\s?Kong)
