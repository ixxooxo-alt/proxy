# 每行末尾的 img-url 是策略组图标的地址（图片在图标仓库里，只影响显示，不影响分流；见 source/icons.yaml）。
# 注意：Loon 官方示例配置注释写明 url-test / fallback“只支持单个节点和远端节点，其他会被忽略”，
# 而现行文档说策略组“支持嵌套”。为避免“手动优先”组在前一种情况下变成空组，它在两个成员组之后
# 还附带同地区节点：若嵌套生效，按 手动 → 自动 → 同地区节点 的顺序；若嵌套被忽略，退化为同地区顺序故障转移，
# 仍不跨国、不直连。实际是哪一种，需要在设备上查看该组的成员列表确认。
# 国外默认：独立选择组，成员为七个地区入口，首次默认日本；所选地区全组不可用时不自动跨国
国外默认 = select,日本,香港,韩国,台湾,新加坡,美国,其他地区,img-url = https://raw.githubusercontent.com/ixxooxo-alt/icon/main/256px/%E5%9B%BD%E5%A4%96%E9%BB%98%E8%AE%A4.png
OpenAI = select,日本,国外默认,香港,韩国,台湾,新加坡,美国,其他地区,DIRECT,img-url = https://raw.githubusercontent.com/ixxooxo-alt/icon/main/256px/OpenAI.png
