# 由统一源生成，请勿手工修改；改动请在 source/ 中进行后重新生成。
# 统一源版本 2026.10.05-2；目标：Quantumult X 1.x（依据官方 sample.conf）
# 适用：iPhone / iPad / Mac 共用同一份配置（平台验收分别记录）
# ⚠ 使用前必须把 [server_remote] 的订阅链接换成你自己的（当前是占位符，不可直接使用）。
# 证书：本配置不含任何 MITM 证书或密码。

[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=5000
network_check_url=http://connectivitycheck.platform.hicloud.com/generate_204
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.lan, *.local, *.localdomain, *.home.arpa, *.msftconnecttest.com, *.msftncsi.com, captive.apple.com, localhost.ptlogin2.qq.com, *.pool.ntp.org, time.apple.com, time.windows.com
excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8
fallback_udp_policy=reject

[dns]
no-ipv6
server=223.5.5.5
server=119.29.29.29
doh-server=https://223.5.5.5/dns-query, https://1.12.12.12/dns-query
server=/*.lan/system
server=/*.local/system
server=/*.localdomain/system
server=/*.home.arpa/system
server=/*.localhost/system

[policy]
# server-tag-regex：按节点名称分地区的正则，由 source/regions.yaml 的词表拼出，不手写。
# 每个地区两条：“手动”用宽的（按名字归到这个地区的全部节点，含名字说不清落地的）；
# “自动 / 故障转移 / 负载均衡”用严的（只收名字只指向这个地区的节点）。
# 名称只是初筛，不证明实际出口；想看每个节点进了哪个组、为什么，在电脑上运行 tools/check_node_names.py。
# 每行末尾的 img-url 是策略组图标的地址（图片在图标仓库里，只影响显示，不影响分流；见 source/icons.yaml）。
