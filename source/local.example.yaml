# 用户本地覆盖示例：复制为 source/local.yaml 后生效（local.yaml 不应分享或提交）。
# 这里的内容与统一源默认值分离，更新统一源时不会被覆盖；生成器同样会校验它。

# 固定节点 / 已验证解锁节点（与你的订阅相关，属于个人数据）
special_entries:
  paypal_fixed:
    pinned_node_name: ""            # 例：填入订阅里某个美国节点的完整名称
  netflix_entry:
    verified_node_regex: ""         # 例：'^(日本 03|日本 05)$'，只填实测解锁的同国节点
    verified_region: ""             # 例：jp
    verified_at: ""                 # 例：2026-09-30

# 额外规则（例如公司内网、自建服务）
extra_services:
  - id: my_company
    group: DIRECT
    title: 公司内网
    rules:
      - {suffix: corp.example.com, ev: my-note}

evidence:
  my-note:
    kind: maintainer
    note: 本人确认的公司内网域名
