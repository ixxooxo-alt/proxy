# 策略组图标。只影响策略组在各客户端里的显示，不影响分流。
#
# 图片不在本工程里：它们在用户自己的图标仓库 https://github.com/ixxooxo-alt/icon （用户设计并上传）。
# 本工程不生成、不重画、不修改任何图片，只登记“哪个策略组用哪张图”，由生成器把图片地址写进配置：
#   Loon          [Proxy Group] 每行末尾的 img-url = 地址
#   Quantumult X  [policy] 每行末尾的 img-url=地址
#   mihomo        proxy-groups 每个组的 icon: 地址
#   sing-box      出站没有图标字段，不写
# 语法依据与没有验证的地方见 docs/02“策略组图标”。
#
# 2026-10-05 起启用（用户 2026-10-04 的要求，原话见 docs/00 文末；在这之前按用户的要求一直没有写图标）。
icons:
  enabled: true               # 改成 false 重新生成，四端都不带图标
  # 图片地址 = base_url + 文件名按 UTF-8 逐字节百分号编码 + ext。地址跟着图标仓库的 main 分支走：仓库里换了图，客户端下次刷新就是新图。
  # 想换成 512px 那一套，把 256px 改成 512px 重新生成即可（图标仓库里两套的文件名相同）。现在用 256px 的理由：策略组图标在 App 里
  # 只是列表里的一个小方块，256px 按界面尺寸估算已经够用（没有在真机上并排比过）；512px 每张约大 3.5 倍，81 张合计约 24 MB 对 7 MB。
  base_url: https://raw.githubusercontent.com/ixxooxo-alt/icon/main/256px/
  ext: .png
  # 文件名和策略组名不一样的写在这里，其余的文件名就是策略组名。
  renamed:
    "Apple Music/TV": "Apple Music／TV"          # 文件名里不能有半角斜杠，图标仓库用的是全角斜杠（U+FF0F）
  # 核对“下面这些图都在”时图标仓库的提交（2026-10-05 08:58 +0800 的提交，也是图标仓库的 v1.0.0 标签；256px/ 目录从 10 月 4 日
  # 第一次核对到这个提交没有变过）。tools/check_icons.py 拿图标仓库的检出目录逐个核对文件存在、是 PNG、尺寸对。
  checked_commit: 2d43eae18d1be7987b620e53e39b49968fa51b83
  checked: 2026-10-05
  # 图标仓库 256px/ 目录里现有的图（文件名去掉 .png）。公开配置里的每个策略组都必须能在这里找到自己的图，
  # 否则生成时报错——组改了名而图没跟上时，宁可报错也不要悄悄少一个图标。
  # DIRECT、REJECT、无可用节点 三张图标仓库里有，但它们不是策略组，哪个客户端都没有地方写，所以没有用到。
  available: [
    "Abema", "Apple", "Apple AI", "Apple Music／TV", "Bahamut", "Bilibili 港澳台", "Claude", "Copilot", "DIRECT", "DMM",
    "Discord", "Disney+", "GitHub", "Google", "Google AI", "Grok", "Hulu Japan", "Hulu US", "LINE", "LinkedIn",
    "Max", "Meta 社交", "Microsoft", "Netflix", "Netflix·解锁入口", "OpenAI", "PayPal", "PayPal·美国固定", "Prime Video",
    "REJECT", "Reddit", "Spotify", "Telegram", "TikTok", "Twitch", "WhatsApp", "X", "YouTube", "其他 AI", "其他地区",
    "其他流媒体", "台湾", "台湾·手动", "台湾·手动优先", "台湾·故障转移", "台湾·自动", "台湾·负载均衡", "国内直连", "国外默认", "广告拦截", "开发下载", "新加坡",
    "新加坡·手动", "新加坡·手动优先", "新加坡·故障转移", "新加坡·自动", "新加坡·负载均衡", "无可用节点", "日本", "日本·手动", "日本·手动优先", "日本·故障转移", "日本·自动",
    "日本·负载均衡", "日本影音", "美国", "美国·手动", "美国·手动优先", "美国·故障转移", "美国·自动", "美国·负载均衡", "远程控制", "韩国", "韩国·手动", "韩国·手动优先",
    "韩国·故障转移", "韩国·自动", "韩国·负载均衡", "香港", "香港·手动", "香港·手动优先", "香港·故障转移", "香港·自动", "香港·负载均衡"
  ]
