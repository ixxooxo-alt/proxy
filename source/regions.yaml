# 统一源：按节点名称把订阅节点分到地区
# 各客户端的地区筛选正则都由这份词表拼出来（generator/regions.py），不手写正则。
# 名称只是初筛，不证明实际出口；实测出口记录见 docs/05-验收记录.md。
#
# 判断顺序（详细说明与依据见 docs/02-语法依据与能力矩阵.md“节点名称分地区”）：
#   0. 提示行（剩余流量、到期时间、官网等）不进任何组。怎样才算提示行见下面 rules.info。
#   1. 名字里有“有效”的国旗：按国旗归属。六个地区和 neutral_flags 以外的国旗都算“其他国家” → 其他地区。
#   2. 没有：看文字。下面这些位置上的词和国旗不算落地（国旗和文字用同一套条件；连写的一串国旗按整串算）：
#        - 后面接着 transit_after 里的词（“日本中转”“🇯🇵中转”；中间只隔连接符也算：“日本 中转”“日本-中转”“HK_Relay”“香港·中转”。
#          连接符 = 空格、连字符、下划线、间隔号、句点、斜杠、破折号；竖线和括号另起一段，不算）、
#          前面是 transit_before 里的词（“via 日本”；中间可以隔一个空格、连字符或下划线：“via-HK”）、后面还有箭头（“日本→美国”）；
#        - “解锁”这类说明：它后面的词和国旗都不算（“解锁: 美国”“解锁美国、韩国流媒体”），一直管到下一个竖线或右括号
#          （“【解锁美国】日本 01”里日本仍是落地；中间又开了括号的，管到名字结尾）；
#          同一段里（中间没有空格、竖线、连字符、下划线）后面跟着它的词和国旗也不算（“美国解锁”“纽约时报解锁”“🇺🇸解锁”），
#          这一段和“解锁”之间隔着空格、连字符、下划线也一样（“美国 解锁”“美国-解锁”）。
#      剩下的词叫“有效”的词（国旗同理）：
#        - 有其他国家的国名 → 其他地区；只有其他国家的城市词、同时又有六个地区之一的国名（“美国 奥克兰”）→ 按国名归这个地区，
#          但算“说不清”（见第 4 条）；
#        - 有某个地区的有效词 → 归这个地区；
#        - 一个有效的词和国旗都没有，但名字里提到了地区（“日本中转 01”“Premium 01 | 解锁美国”“🇯🇵中转 01”）→ 仍归提到的地区，
#          但只进它的手动组（见第 4 条）。
#   3. 让位（yields）：香港在节点名里多半是中转（“香港-日本 01”“深港专线 东京 01”），名字里同时出现别的地区的有效词时
#      归别的地区。例外（2026-10-03 审核 F05）：名字里有“香港 / HK”这样的国名一级的词，而别的地区只有城市一级的词
#      （“香港 01 纽约时报”“香港-东京 01”）——城市词也可能只是宣传语里的字眼，这时不让位，两边都算，按“说不清”处理（见第 4 条）。
#   4. 说不清落地的节点只进手动组（2026-10-04 用户决定）：每个地区有两条筛选——
#        - 宽的：按上面的顺序算出来的全部节点，给“手动”组和 PayPal 的美国固定入口用；
#        - 严的：只收“有这个地区有效的国旗或有效的词、而且名字只指向这一个地区”的节点，给“自动 / 故障转移 / 负载均衡”用。
#      下面几种只进宽的那条：两个地区都像落地（“日本-美国 01”“🇯🇵 Tokyo 01 🇺🇸”）；一个有效的词和国旗都没有
#      （提到一个地区的“日本中转 01”“IEPL 01 Unlock US”，提到不止一个的“香港中转 日本中转 01”——2026-10-04 审核 r9 的 F01：
#      以前只提到一个地区的会进严的那条，等于拿“解锁说明 / 中转位置里的地名”当了落地依据）；
#      六个地区的国名和其他国家的城市词同时出现（“美国 奥克兰 01”）；香港的国名和别的地区的城市词同时出现（“香港-东京 01”，见第 3 条）。
#      tools/check_node_names.py 会把它们单独列出来；可以在 local.yaml 的 node_names.assign 里指定归属，指定后两条都进。
#   5. 以上都没有归属、又不是提示行的节点 → 其他地区（只有手动）。
#
# 词表写法：
#   flags    国旗，写 ISO 3166-1 两位字母（生成器换成对应的国旗表情）。其他国家的国旗不用列：
#            凡是不属于六个地区、也不在 neutral_flags 里的国旗，都按“其他国家”处理
#   country  国名一级的词（国名、代码、专线简称）。分开列是因为第 2 条：它压得过其他国家的“城市词”
#   words    按原样出现就算（中文、韩文等；不要放纯英文，纯英文放 latin）。地区里的 words / latin 放城市、州、运营商、机场代码
#   latin    英文词与代码：不分大小写；前后不能紧挨英文字母（所以 US 不会命中 RUS、AUS、Plus）；
#            词里的空格可以是空格、下划线、连字符，也可以没有（Los Angeles / Los_Angeles / LosAngeles）
#   patterns 需要附加条件的词，直接写正则片段（只用各端都支持的写法；不得含英文逗号、双引号、反引号、等号、空格）
# 不收单个字的简称（日、美、韩、台、新）：“新”常用来标新节点，“日”“台”“美”出现在很多无关的词里；
# 只有“港”例外（深港、沪港这类专线简称太常见，而且香港遇到别的地区会让位）；它写在香港的 patterns 里，带着“不在更长的词里”的条件。
# 某家机场特有的写法不要加在这里，写进 source/local.yaml 的 node_names（只进私密产物）。

rules:
  # 提示行：机场面板往订阅里插的“剩余流量：…”“官网：…”这类条目，不是节点，不进任何组。
  # 2026-10-03 审核 F02：以前名字里任何位置出现这些词就算提示行，“日本 01 全网站解锁”“美国 01 ChatGPT官网可用”
  # 这类真节点会从所有组里消失。现在分三种情况，满足任意一种才算提示行：
  #   1. 名字里有 always 里的固定写法（常见面板源码里写死的句子，真节点不会这样写）；
  #   2. words / colon_words / latin 里的词后面紧跟冒号（半角、全角都算，中间可以有空格），而且这个词前面
  #      没有数字和竖线（“官网：hk.example.com”“公告：香港节点维护”算；“香港 01 | 官网：abc.com”是带广告语的真节点，不算）；
  #   3. 名字里有 words / latin 里的词（colon_words 要带冒号），而且整个名字里没有任何地区的词和国旗
  #      （“官网 example.com”“请更新订阅”算；“美国 01 ChatGPT官网可用”有地区词，是真节点）。
  # 取舍：机场自创的提示行如果既带地区字样、又不是“词 + 冒号”开头（“官网 xxx.hk”），会被当成节点进组——
  # 它不会被自动模式选中（测速不通），只是手动列表里多一行；反过来把真节点当成提示行，节点就没了，所以宁可偏向前者。
  info:
    # 依据：V2Board、Xboard 的 ClientController::setSubscribeInfoToServers 写出“剩余流量：…”“距离下次重置剩余：… 天”
    # “套餐到期：…”（2026-10-02 读取源码）
    always: [剩余流量, 剩餘流量, 套餐到期, 距离下次重置, 距離下次重置, 重置剩余, 重置剩餘]
    words: [剩余, 剩餘, 到期, 过期, 過期, 官网, 官網, 网址, 網址, 网站, 網站, 套餐, 重置, 客服, 发布页, 發布頁,
            公告, 邮箱, 郵箱, 群组, 群組, 交流群, 电报群, 電報群, TG群, QQ群, 频道, 頻道,
            总流量, 總流量, 已用, 防失联, 防失聯, 订阅, 訂閱, 工单, 工單,
            过滤掉, 過濾掉]                              # Xboard：“过滤掉 N 条线路”
    # 只在后面紧跟冒号时才算：单独出现太常见（“香港 03 大流量”“开曼群岛 01”）
    colon_words: [群, 流量]
    latin: [Expire, Traffic, Remaining, Reset]          # 只要求前面不紧挨英文字母（Expires / Expired 也算）
  # 接在地名或国旗后面（中间可以隔连接符：空格、连字符、下划线、间隔号、句点、斜杠、破折号）、说明它不是落地的词。
  # 单独的“转”管“港转美”“日本转美国”“香港 转发”这类写法（“中转”以“中”开头，所以两个都要列）
  transit_after: [中转, 中轉, 中继, 中繼, 转, 轉, 入口, relay, transit]
  # 写在地名或国旗前面的词（中间最多隔一个空格、连字符或下划线）。它只管紧跟在后面的那一个词：
  # “经由日本”“via South Korea”“经深港”这几种中间多了字的认不出来（记在 tests/node_names.yaml 的 known_auto_limits）
  transit_before: [via, 经, 經]
  # “解锁”这类说明：见上面判断顺序第 2 条。英文词要求前面不紧挨英文字母
  # 2026-10-03 审核 F03：以前只认“解锁”紧挨着地名的写法，“解锁: 美国”中间多一个冒号，美国就被当成了落地
  unlock: [解锁, 解鎖, unlock]
  arrows: ["→", "->", "=>", "⇒", "➜", "➡", "➔", "⟶"]
  # 不当作地区依据的国旗：CN 被不少机场用来标台湾、香港节点；EU、UN 不是国家
  neutral_flags: [CN, EU, UN]

regions:
  - id: hk
    name: 香港
    yields: true
    flags: [HK]
    country:
      words: [香港]
      latin: [HK, HKG, Hong Kong]
    words: [九龙, 九龍, 新界, 沙田, 荃湾, 荃灣, 葵涌, 将军澳, 將軍澳, 观塘, 觀塘, 柴湾, 柴灣]
    latin: [Kowloon,
            HKT, HKBN, HGC, PCCW, WTT, CMHK]             # 本地运营商
    # 单个字的“港”：已经覆盖深港、沪港、广港、莞港、中港这些专线简称。它不算国名一级——日文的“空港”（机场）里也有这个字，
    # 所以只有它的时候，遇到别的地区的任何有效词都让位（“深港专线 东京 01”“关西空港 大阪 01”归日本）。
    # 写成带条件的片段，是因为它会出现在更长的词里面：“香港”里的“港”、专线简称“港日 / 港韩 / 港美”里的“港”
    # 不单独算一次，由那个更长的词说了算。不这样的话，“经香港 01”里“香港”在“经”后面不算落地，“港”却因为前面是“香”
    # 照样算；“港日中转 01”里“港日”后面接着中转词不算落地，“港”却因为后面是“日”照样算——两个名字都会进香港的自动类的组
    # （2026-10-05 交付前自查）。词表里再加带“港”字的词时，这里要跟着改（tests/test_regions.py 有一项检查会提醒）
    patterns:
      - '(?<!香)港(?![日韩韓美])'

  - id: jp
    name: 日本
    flags: [JP]
    country:
      words: [日本,
              # 专线简称（国内城市或香港 + 日）
              沪日, 滬日, 深日, 广日, 廣日, 莞日, 杭日, 苏日, 蘇日, 厦日, 廈日, 泉日, 川日, 京日, 港日]
      latin: [JP, JPN, Japan]
    words: [东京, 東京, 大阪, 名古屋, 福冈, 福岡, 横滨, 橫濱, 横浜, 埼玉, 千叶, 千葉, 京都, 札幌, 川崎,
            神户, 神戶, 仙台, 冲绳, 沖繩, 广岛, 廣島]
    latin: [Tokyo, Osaka, Nagoya, Fukuoka, Yokohama, Saitama, Chiba, Kyoto, Sapporo, Kawasaki,
            Kobe, Sendai, Okinawa, Hiroshima,
            NRT, HND, KIX, TYO, OSA]                     # 机场 / 城市代码

  - id: kr
    name: 韩国
    flags: [KR]
    country:
      words: [韩国, 韓國, 南韩, 南韓, 한국,
              沪韩, 滬韓, 深韩, 深韓, 广韩, 廣韓, 港韩, 港韓]          # 专线简称
      latin: [KR, KOR, Korea]
    words: [首尔, 首爾, 春川, 釜山, 仁川, 서울]
    latin: [Seoul, Chuncheon, Busan, Incheon, ICN]
    # “North Korea”在其他国家的词表里：名字里同时有其他国家的词时归其他地区，所以它不会进韩国

  - id: tw
    name: 台湾
    flags: [TW]
    country:
      words: [台湾, 台灣, 臺灣,
              沪台, 滬台, 深台, 广台, 廣台, 厦台, 廈台, 闽台, 閩台]    # 专线简称。不收“港台”：它也常指港台解锁，仍按香港算
      latin: [TW, TWN, Taiwan]
    words: [台北, 臺北, 新北, 臺中, 台南, 臺南, 高雄, 桃园, 桃園, 彰化, 新竹, 基隆, 嘉义, 嘉義,
            中华电信, 中華電信]
    latin: [Taipei, Taichung, Tainan, Kaohsiung, Taoyuan, Changhua, Hsinchu, Keelung, Chiayi,
            HiNet, Seednet, TPE]
    patterns:
      - '台中(?![转轉继繼])'                              # “多平台中转”不是台中

  - id: sg
    name: 新加坡
    flags: [SG]
    country:
      words: [新加坡, 狮城, 獅城, 星加坡, 坡县, 坡縣,
              沪新, 滬新, 深新, 广新, 廣新]                        # 专线简称。不收“港新”：“香港新增”“香港新界”太常见，仍按香港算
      latin: [SG, SGP, Singapore]
    latin: [SIN]                                         # 机场代码

  - id: us
    name: 美国
    flags: [US, UM]                                      # UM 的国旗与美国相同，有的机场混用
    country:
      words: [美国, 美國, 美西, 美东, 美東,
              沪美, 滬美, 深美, 广美, 廣美, 港美]                  # 专线简称
      latin: [US, USA, United States, America, American]
    words: [# 城市与州（简体 / 繁体）
            洛杉矶, 洛杉磯, 圣何塞, 聖何塞, 圣荷西, 聖荷西, 硅谷, 矽谷, 西雅图, 西雅圖, 达拉斯, 達拉斯, 芝加哥,
            纽约, 紐約, 凤凰城, 鳳凰城, 阿什本, 弗吉尼亚, 弗吉尼亞, 維吉尼亞, 迈阿密, 邁阿密, 亚特兰大, 亞特蘭大,
            丹佛, 拉斯维加斯, 拉斯維加斯, 旧金山, 舊金山, 三藩市, 费利蒙, 費利蒙, 弗里蒙特, 佛利蒙, 波特兰, 波特蘭,
            休斯顿, 休斯頓, 休士頓, 盐湖城, 鹽湖城, 堪萨斯, 堪薩斯, 俄勒冈, 俄勒岡, 加州, 德州, 新泽西, 新澤西,
            纽泽西, 紐澤西, 夏威夷, 檀香山, 阿拉斯加, 安克雷奇, 波士顿, 波士頓, 圣克拉拉, 聖克拉拉, 华盛顿, 華盛頓,
            费城, 費城, 水牛城, 布法罗, 俄亥俄, 哥伦布, 哥倫布, 伊利诺伊, 伊利諾, 底特律, 印第安纳波利斯, 路易斯维尔,
            明尼阿波利斯, 圣路易斯, 聖路易斯, 匹兹堡, 匹茲堡, 克利夫兰, 克里夫蘭, 辛辛那提, 奥马哈, 奧馬哈,
            萨克拉门托, 奥斯汀, 奧斯汀, 圣安东尼奥, 聖安東尼奧, 坦帕, 奥兰多, 奧蘭多, 夏洛特, 纳什维尔, 納什維爾,
            得梅因, 爱荷华, 愛荷華, 艾奥瓦, 犹他, 猶他, 内华达, 內華達, 亚利桑那, 亞利桑那, 佛罗里达, 佛羅里達,
            圣迭戈, 希尔斯伯勒, 雷斯顿, 桑尼维尔, 帕洛阿尔托, 山景城,
            加利福尼亚, 加利福尼亞, 德克萨斯, 得克萨斯, 德克薩斯, 休斯敦, 菲尼克斯, 纽瓦克]
    # 没收的同名地：奥克兰（也指新西兰 Auckland）、圣地亚哥（也指智利 Santiago）、Vancouver、Birmingham、
    # Richmond、Petersburg、Georgia（也是国家）、LA / SEA（也指老挝、东南亚）。
    # “美国 奥克兰 01”这种国名和别国城市词同时出现的，按国名进美国·手动，不进自动（判断顺序第 2、4 条）
    latin: [Los Angeles, San Jose, Silicon Valley, Santa Clara, Fremont, Sunnyvale, Palo Alto, Mountain View,
            San Francisco, San Diego, Sacramento, Seattle, Portland, Hillsboro, Las Vegas, Phoenix, Salt Lake,
            Denver, Dallas, Houston, Austin, San Antonio, Kansas City, Chicago, Saint Louis, St Louis, St. Louis,
            Minneapolis, Omaha, Des Moines, Council Bluffs, Detroit, Indianapolis, Louisville, Columbus, Cleveland,
            Cincinnati, Pittsburgh, Buffalo, New York, NYC, Newark, Secaucus, Piscataway, New Jersey, Boston,
            Philadelphia, Washington, Ashburn, Reston, Sterling, Virginia, Atlanta, Charlotte, Nashville, Miami,
            Tampa, Orlando, Honolulu, Anchorage,
            California, Oregon, Texas, Nevada, Arizona, Utah, Iowa, Ohio, Illinois, Florida, Hawaii, Alaska,
            LAX, SJC, SFO, PDX, PHX, SLC, DFW, IAH, ORD, JFK, EWR, IAD, ATL]     # 机场代码
    # South / Latin / North / Central America 在其他国家的词表里，所以它们不会进美国

other_region:
  id: other
  name: 其他地区
  # 不属于以上六个地区、也不是提示行的节点；默认纯手动，不提供跨国自动模式

# 其他国家：只用来判断“这个节点落地在别的国家”，它们都归“其他地区”，不单独建组。
