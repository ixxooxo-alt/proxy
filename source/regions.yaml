    name: 香港
    yields: true
    flags: [HK]
    words: [香港, 港, 九龙, 九龍, 新界, 沙田, 荃湾, 荃灣, 葵涌, 将军澳, 將軍澳, 观塘, 觀塘, 柴湾, 柴灣]
