# 统一源：按节点名称把订阅节点分到地区
# 各客户端的地区筛选正则都由这份词表拼出来（generator/regions.py），不手写正则。
# 名称只是初筛，不证明实际出口；实测出口记录见 docs/05-验收记录.md。
#
# 判断顺序（详细说明与依据见 docs/02-语法依据与能力矩阵.md“节点名称分地区”）：
#   0. 信息节点（剩余流量、到期时间、官网等）不进任何组。
#   1. 名字里有国旗：按国旗归属。六个地区和 neutral_flags 以外的国旗都算“其他国家” → 其他地区。
#   2. 没有国旗：看文字。处在“中转 / 入口”位置的词先不算：紧跟 transit_after 里的词、
#      前面是 transit_before 里的词、或后面还有箭头。
#        - 还剩下某个地区的词 → 归这个地区；同时有其他国家的词 → 其他地区。
#        - 一个都不剩，但名字里只提到一个地区（例如“日本中转 01”）→ 仍归这个地区。
#   3. 让位（yields）：香港在节点名里多半是中转，名字里同时出现别的地区时归别的地区。
#   4. 两个不让位的地区同时出现、说不清落地（例如“日本-美国 01”）→ 两个地区都进，
#      tools/check_node_names.py 会单独列出。
#   5. 以上都没有归属的非信息节点 → 其他地区。
#
# 词表写法：
#   flags    国旗，写 ISO 3166-1 两位字母（生成器换成对应的国旗表情）。其他国家的国旗不用列：
#            凡是不属于六个地区、也不在 neutral_flags 里的国旗，都按“其他国家”处理
#   words    按原样出现就算（中文、韩文等；不要放纯英文，纯英文放 latin）
#   latin    英文词与代码：不分大小写；前后不能紧挨英文字母（所以 US 不会命中 RUS、AUS、Plus）；
#            词里的空格可以是空格、下划线、连字符，也可以没有（Los Angeles / Los_Angeles / LosAngeles）
#   patterns 需要附加条件的词，直接写正则片段（只用各端都支持的写法；不得含英文逗号、双引号、反引号、等号、空格）
# 不收单个字的简称（日、美、韩、台、新）：“新”常用来标新节点，“日”“台”“美”出现在很多无关的词里；
# 只有“港”例外（深港、沪港这类专线简称太常见，而且香港遇到别的地区会让位）。
# 某家机场特有的写法不要加在这里，写进 source/local.yaml 的 node_names（只进私密产物）。

rules:
  info:
    words: [剩余, 剩餘, 到期, 过期, 過期, 官网, 官網, 网址, 網址, 网站, 網站, 套餐, 重置, 客服, 发布页, 發布頁,
            公告, 邮箱, 郵箱, 群组, 群組, 交流群, 电报群, 電報群, TG群, QQ群, "群：", "群:", 频道, 頻道,
            总流量, 總流量, 已用, "流量：", "流量:", 防失联, 防失聯, 订阅, 訂閱, 工单, 工單, 过滤掉, 過濾掉]
    # 依据：常见机场面板在订阅里插入的提示行。V2Board、Xboard 的 ClientController::setSubscribeInfoToServers
    # 写出“剩余流量：…”“距离下次重置剩余：… 天”“套餐到期：…”，Xboard 另有“过滤掉 N 条线路”（2026-10-02 读取源码）。
    # 不用单独的“流量”“官方”“群”：会误删“香港 03 大流量”“开曼群岛 01”这类真节点
    latin: [Expire, Traffic, Remaining, Reset]          # 只要求前面不紧挨英文字母（Expires / Expired 也算）
  # 紧跟在地名后面、说明这个地名不是落地的词。“日本解锁”说的是能看日本内容，不是落地日本；
  # 单独的“转”管“港转美”“日本转美国”“香港 转发”这类写法（“中转”以“中”开头，所以两个都要列）
  transit_after: [中转, 中轉, 中继, 中繼, 转, 轉, 入口, 解锁, 解鎖, relay, transit]
  transit_before: [via, 经, 經, 解锁, 解鎖]
  arrows: ["→", "->", "=>", "⇒", "➜", "➡", "➔", "⟶"]
  # 不当作地区依据的国旗：CN 被不少机场用来标台湾、香港节点；EU、UN 不是国家
  neutral_flags: [CN, EU, UN]

regions:
