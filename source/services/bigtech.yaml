      - {host: "windows.net（*.blob.core.windows.net 等）/ azurewebsites.net / azureedge.net", ev: maintainer, why: Azure 共享云，所有客户共用，不收}
      - {host: azure.com, ev: maintainer, to: 国外默认, probe: [portal.azure.com, myvm.eastus.cloudapp.azure.com], why: 含客户自有的云主机（*.cloudapp.azure.com、*.database.azure.com 等），属于共享云，2026-09-29 移出 Microsoft；Azure 门户等走国外默认}

  - id: github
