# 流媒体服务归属。共享 CDN（akamaized.net、cloudfront.net 等）只收专属主机名，不收整个根域。
# upstream：固定快照里对应的上游列表（见 ai.yaml 文件头说明）。
# 上游列表里的防御性注册域名、公司官网 / 招聘 / 投资者站点、CNAME 目标（*.edgesuite.net 等，客户端不会直接请求）
# 不收录；只收客户端实际会连接的接口、播放与 CDN 主机，且以地区敏感的服务为主。

services:
  - id: youtube
    group: YouTube
    title: YouTube
    upstream: {dlc: [youtube]}
    rules:
      - {suffix: youtube.com, ev: dlc}
      - {suffix: youtu.be, ev: dlc}
      - {suffix: yt.be, ev: dlc}
      - {suffix: ytimg.com, ev: dlc}
      - {suffix: googlevideo.com, ev: dlc, note: 视频流}
      - {suffix: youtube-nocookie.com, ev: dlc}
      - {suffix: youtubekids.com, ev: dlc}
      - {domain: youtubei.googleapis.com, ev: dlc, note: 应用接口，必须在 Google 通用规则之前}
      - {domain: youtube.googleapis.com, ev: dlc}
      - {suffix: youtubeembeddedplayer.googleapis.com, ev: dlc, note: 嵌入式播放器接口}
      - {domain: yt3.ggpht.com, ev: dlc, note: 频道头像；ggpht.com 其余归 Google}
      - {domain: yt3.googleusercontent.com, ev: dlc, note: 频道头像与横幅；googleusercontent.com 其余归 Google}
    shared_excluded:
      - {host: ggpht.com, ev: dlc, to: Google, probe: [lh5.ggpht.com], why: 上游把整个 ggpht.com 归 youtube；它也承载 Google Play、Blogger 等图片，本项目只把 yt3.ggpht.com 归 YouTube，其余归 Google}
      - {host: "youtube-ui.l.google.com / wide-youtube.l.google.com", ev: dlc, why: CNAME 目标，客户端不直接请求}

  - id: netflix
    group: Netflix
    title: Netflix
    upstream: {dlc: [netflix]}
    rules:
      - {suffix: netflix.com, ev: dlc}
      - {suffix: netflix.net, ev: dlc}
      - {suffix: nflxext.com, ev: dlc}
      - {suffix: nflximg.com, ev: dlc}
      - {suffix: nflximg.net, ev: dlc}
      - {suffix: nflxso.net, ev: dlc}
      - {suffix: nflxvideo.net, ev: dlc}
      - {suffix: nflxsearch.net, ev: dlc, note: 搜索}
      - {suffix: fast.com, ev: dlc, note: Netflix 测速站}
      - {suffix: netflixdnstest0.com, ev: dlc, note: 客户端 DNS 检测域名（上游列出 0–10 共 11 个）}
      - {suffix: netflixdnstest1.com, ev: dlc}
      - {suffix: netflixdnstest2.com, ev: dlc}
      - {suffix: netflixdnstest3.com, ev: dlc}
      - {suffix: netflixdnstest4.com, ev: dlc}
      - {suffix: netflixdnstest5.com, ev: dlc}
      - {suffix: netflixdnstest6.com, ev: dlc}
      - {suffix: netflixdnstest7.com, ev: dlc}
      - {suffix: netflixdnstest8.com, ev: dlc}
      - {suffix: netflixdnstest9.com, ev: dlc}
      - {suffix: netflixdnstest10.com, ev: dlc}
    notes: Netflix Open Connect IP 段本版本未收录（netflix-oc），直接 IP 连接会落入国外默认。

