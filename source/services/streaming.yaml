    shared_excluded:
      - {host: media-amazon.com, ev: maintainer, to: 国外默认, probe: [m.media-amazon.com], why: 与 Amazon 购物共用的图片域名 → Amazon 通用（国外默认）}
      - {host: "images-na / images-eu / images-fe.ssl-images-amazon.com", ev: dlc, to: 国外默认, probe: [images-na.ssl-images-amazon.com, images-eu.ssl-images-amazon.com, images-fe.ssl-images-amazon.com], why: 上游 primevideo 列表收录，但与 Amazon 购物共用 → Amazon 通用（国外默认）}
      - {host: static.siege-amazon.com, ev: dlc, to: 国外默认, probe: [static.siege-amazon.com], why: 上游收录；用途未核实，可能与 Amazon 购物页面共用，未收录（落入国外默认）}
      - {host: "www.amazon.com / fls-na.amazon.com", ev: bm7-snap, to: 国外默认, probe: [www.amazon.com, fls-na.amazon.com], why: bm7 PrimeVideo 收录，但属于 Amazon 购物 / 通用日志 → Amazon 通用}

