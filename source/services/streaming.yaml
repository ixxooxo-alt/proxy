      - {domain: d22qjgkvxw22r6.cloudfront.net, ev: dlc}
      - {domain: d25xi40x97liuc.cloudfront.net, ev: dlc}
      - {domain: d27xxe7juh1us6.cloudfront.net, ev: dlc}
