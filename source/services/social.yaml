      - {suffix: fb.com, ev: dlc}
      - {suffix: fb.me, ev: dlc}
      - {suffix: fbcdn.net, ev: dlc}
      - {suffix: fbsbx.com, ev: dlc}
      - {suffix: instagram.com, ev: dlc}
      - {suffix: cdninstagram.com, ev: dlc}
      - {suffix: ig.me, ev: dlc}
