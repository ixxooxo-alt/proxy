services:
  - id: telegram
    group: Telegram
    title: Telegram
    upstream: {dlc: [telegram]}
    rules:
      - {suffix: telegram.org, ev: dlc}
      - {suffix: t.me, ev: dlc}
      - {suffix: telegram.me, ev: dlc}
      - {suffix: telesco.pe, ev: dlc}
      - {suffix: telegra.ph, ev: dlc}
      - {suffix: tdesktop.com, ev: dlc}
      - {suffix: telegram-cdn.org, ev: dlc}
      - {suffix: cdn-telegram.org, ev: dlc}
      - {suffix: fragment.com, ev: dlc}
      # Telegram 客户端直接用 IP 连接，必须有 IP 规则（第 7 阶段，不触发 DNS 解析）
      - {ip4: 91.105.192.0/23, ev: telegram-cidr}
      - {ip4: 91.108.4.0/22, ev: telegram-cidr}
      - {ip4: 91.108.8.0/22, ev: telegram-cidr}
      - {ip4: 91.108.12.0/22, ev: telegram-cidr}
      - {ip4: 91.108.16.0/22, ev: telegram-cidr}
      - {ip4: 91.108.20.0/22, ev: telegram-cidr}
      - {ip4: 91.108.56.0/22, ev: telegram-cidr}
      - {ip4: 149.154.160.0/20, ev: telegram-cidr}
      - {ip4: 185.76.151.0/24, ev: telegram-cidr}
      - {ip6: '2001:67c:4e8::/48', ev: telegram-cidr}
      - {ip6: '2001:b28:f23c::/48', ev: telegram-cidr}
      - {ip6: '2001:b28:f23d::/48', ev: telegram-cidr}
      - {ip6: '2001:b28:f23f::/48', ev: telegram-cidr}
      - {ip6: '2a0a:f280::/32', ev: telegram-cidr}

