# AI 服务归属。按“本机实际连接目标”分流：
#   本机连 Cursor 后端 → Cursor；本机直连 OpenAI API → OpenAI；本机直连 Anthropic API → Claude。
#   服务器端再调用模型厂商的连接不经过本机规则，不因 Cursor 使用某模型就把该厂商 API 收进 Cursor。
# 共享的登录、令牌、资源（googleapis.com、googleusercontent.com、gstatic.com 等）不归单一 AI。
#
# upstream：该服务在固定快照里对应的上游列表（dlc = domain-list-community，bm7 = blackmatrix7）。
#   ev: dlc / bm7-snap 的规则必须能在这些列表里找到；核对记录见 docs/evidence/upstream-snapshot.json。

services:
  - id: openai
    group: OpenAI
    title: ChatGPT、OpenAI API、Codex（Sora 已停服，见 shared_excluded）
    upstream: {dlc: [openai]}
    rules:
      - {suffix: openai.com, ev: openai-net}
      - {suffix: chatgpt.com, ev: openai-net, note: 含 ws.chatgpt.com 会话推送与 Codex 流式}
      - {suffix: oaistatic.com, ev: openai-net}
      - {suffix: oaiusercontent.com, ev: openai-net}
      - {suffix: oaistatsig.com, ev: openai-net}
      - {domain: cdn.openaimerge.com, ev: openai-net}
      - {suffix: chat.com, ev: dlc, note: OpenAI 持有，跳转到 ChatGPT}
      - {suffix: chatgpt.livekit.cloud, ev: dlc, note: ChatGPT 语音（LiveKit 上的 ChatGPT 专属主机）}
    shared_excluded:
      - {host: "*.ct.sendgrid.net", ev: openai-net, to: 国外默认, probe: [u123.ct.sendgrid.net], why: 邮件链接跟踪，第三方共享服务（验证邮件会用到，见广告例外）}
      - {host: "*.intercom.io / *.intercomcdn.com", ev: openai-net, to: 国外默认, probe: [widget.intercom.io, js.intercomcdn.com], why: 客服组件，多家公司共用}
      - {host: js.stripe.com, ev: openai-net, to: 国外默认, probe: [js.stripe.com], why: 支付组件，多家公司共用}
      - {host: "*.workos.com / images.workoscdn.com / workos.imgix.net", ev: openai-net, to: 国外默认, probe: [api.workos.com, images.workoscdn.com, workos.imgix.net], why: 第三方登录服务，Cursor 等也在用}
      - {host: challenges.cloudflare.com, ev: openai-net, to: 国外默认, probe: [challenges.cloudflare.com], why: Cloudflare 人机验证，全网共用}
      - {host: humb.apple.com, ev: openai-net, to: Apple, probe: [humb.apple.com], why: Apple 服务}
      - {host: "*.ingest.sentry.io / rum.browser-intake-datadoghq.com", ev: openai-net, why: 第三方遥测}
      - {host: "UDP 3478 + chatgpt-voice.json IP 段", ev: openai-net, why: 语音模式需要的 IP 段未收录，需按官方 JSON 核实后再加}
      - {host: sora.com, ev: openai-sora-eol, to: 国外默认, probe: [sora.com], why: Sora 网页与 App 已于 2026-04-26 停服、API 于 2026-09-24 停服，规则已删除；导出页 sora.chatgpt.com 已被 chatgpt.com 覆盖}
      - {host: "host.livekit.cloud / turn.livekit.cloud", ev: dlc, to: 国外默认, probe: [host.livekit.cloud, turn.livekit.cloud], why: 上游 openai 列表收录，但这是 LiveKit 所有客户共用的设施，不归 OpenAI（落入国外默认）}
      - {host: "openai 官网静态资源（*.azureedge.net / *.blob.core.windows.net / *.azurefd.net / openaicom.imgix.net 上的专属主机）", ev: dlc, to: 国外默认, probe: [openaicom.imgix.net], why: 上游收录；只影响官网图片等静态资源，不影响地区判断，未收录（落入国外默认）}

  - id: claude
    group: Claude
    title: Claude 网页 / 应用、Anthropic API、Claude Code
    upstream: {dlc: [anthropic]}
    rules:
      - {suffix: anthropic.com, ev: claude-net, note: api / mcp-proxy / assets-proxy 等}
      - {suffix: claude.ai, ev: claude-net, note: 含 downloads.claude.ai}
      - {suffix: claude.com, ev: claude-net, note: 含 platform.claude.com、code.claude.com}
      - {suffix: claudeusercontent.com, ev: claude-net, note: 含 bridge / *.frame 等}
      - {suffix: claudemcpclient.com, ev: dlc, note: 上游 anthropic 列表收录（MCP 相关）}
      - {suffix: claudemcpcontent.com, ev: claude-desktop-net, note: 桌面版官方网络要求列出 *.claudemcpcontent.com}
      - {suffix: claude.app, ev: claude-desktop-net, note: 桌面版官方网络要求列出 claude.app 与 *.claude.app（从 Cursor 版迁入）}
      - {suffix: clau.de, ev: dlc, note: 短链接}
      # 使用者 2026-11-18 给的 Claude 域名清单里另外这 10 个（官方网络要求和 dlc anthropic 快照里都没有，照清单收；docs/00 最后一节）
      - {suffix: ant.dev, ev: owner-claude-domains}
      - {suffix: anthropic.team, ev: owner-claude-domains}
      - {suffix: antspace.dev, ev: owner-claude-domains}
      - {suffix: chatbotclaude.com, ev: owner-claude-domains}
      - {suffix: claude.dev, ev: owner-claude-domains}
      - {suffix: claude.new, ev: owner-claude-domains}
      - {suffix: claude.site, ev: owner-claude-domains}
      - {suffix: claudeacademy.com, ev: owner-claude-domains}
      - {suffix: claudepages.dev, ev: owner-claude-domains}
      - {suffix: claudestudio.com, ev: owner-claude-domains}
      # Claude Code 官方网络要求页面列出的第三方主机里，会让 Anthropic 看到你的 IP 的（使用者 2026-11-19 定的标准：“如果最终它会给 Cloud 返回 IP……
      # 那就分流到 Cloud 里面”，docs/00 最后几节）：Datadog 的两个入口收的是 Anthropic 自己账号里的运行日志和错误报告；storage.googleapis.com 上
      # 是 Anthropic 自己的存储桶（插件数据、旧版安装包），桶的主人开了访问记录就能看到下载者的 IP。都只收这一个主机，不收根域。
      # 页面列的其余第三方主机（GitHub、npm、Homebrew、Google 字体、公共 CDN、Gerrit）是别家的公共服务，不把访问者的 IP 交给 Anthropic，见 shared_excluded
      - {domain: http-intake.logs.us5.datadoghq.com, ev: claude-net, note: Claude Code 的运行遥测（可选），进 Anthropic 的 Datadog 账号；使用者 2026-11-19 选的}
      - {domain: browser-intake-us5-datadoghq.com, ev: claude-net, note: Claude Code 的错误报告（可选），进 Anthropic 的 Datadog 账号}
      - {domain: storage.googleapis.com, ev: claude-net, note: Anthropic 的存储桶（插件安装数和元数据；2.1.116 以前的原生安装和自动更新）；它是 Google Cloud Storage 的公共入口，别的 App 用到也走 Claude}
      # 使用者 2026-11-20 给的清单（“这几个据说也是 Claude 的网址”），先核实再收（他接着说“或者验证一下再添加进去分流”）：Anthropic 信任中心公布的
      # 分包处理方里有 Intercom、Stripe、Sentry、Sift（anthropic-subprocessors），这些服务会把访问者的 IP 交给用它的公司（这里是 Anthropic）。
      # 都是很多网站共用的服务，别家网站的客服聊天、Stripe 付款、Sentry 报错等也会走 Claude 组（docs/06 2026-11-20 一节）
      - {domain: api-iam.intercom.io, ev: claude-support-intercom, note: Intercom 客服聊天的接口；客服看得到来访者的 IP 和位置}
      - {domain: nexus-websocket-a.intercom.io, ev: claude-support-intercom, note: Intercom 客服聊天的实时连接}
      - {domain: r.stripe.com, ev: anthropic-subprocessors, note: Stripe 付款页发回的风控信号；商户在付款记录里看得到付款人的 IP}
      - {suffix: us.sentry.io, ev: anthropic-subprocessors, note: Sentry 美国区的错误上报（o*.ingest.us.sentry.io），默认记下发送方的 IP}
      - {suffix: siftscience.com, ev: anthropic-subprocessors, note: Sift 的反欺诈（设备指纹、IP）}
      # Anthropic 官方公布的、它的服务接收连接的地址（清单里的 34.8.0.0/16 不在其中，没有收，见 shared_excluded）
      - {ip4: 160.79.104.0/23, ev: claude-ip}
      - {ip4: 153.61.224.0/22, ev: claude-ip}
      - {ip6: "2607:6bc0::/48", ev: claude-ip}
    shared_excluded:
      - {host: fcmtoken.googleapis.com, ev: owner-claude-list-1120, to: Google, probe: [fcmtoken.googleapis.com], why: 使用者 2026-11-20 的清单里有；它是 Google 的推送令牌服务（Firebase Cloud Messaging），IP 只到 Google，Anthropic 拿到的只是令牌，按他定的标准不进 Claude → Google}
      - {host: 34.8.0.0/16, ev: claude-ip, why: 使用者 2026-11-20 的清单里有；查实是 Google Cloud 的公共地址段（Google 公布的 cloud.json 写的是“Google Cloud，global”，ARIN 登记的所有者是 Google LLC），不在 Anthropic 官方公布的地址里，整段收进来会把这一段里别家的服务一起拉进 Claude 组；改收官方公布的三段}
      - {host: "us5.datadoghq.com（整个后缀）", ev: claude-net, why: 使用者 2026-11-20 的清单里有；Datadog 不在 Anthropic 公布的分包处理方里，Claude Code 官方页面只列了这个机房的两个入口（上面单独收了），整个后缀没有依据}
      # 下面这些官方页面也列了，但都是别家的公共服务，访问者的 IP 不会交给 Anthropic（使用者 2026-11-19 定的标准），照旧归原来的组
      - {host: registry.npmjs.org, ev: claude-net, to: 开发下载, probe: [registry.npmjs.org], why: npm 的公共源，不把下载者的 IP 交给包的作者 → 开发下载}
      - {host: "github.com / raw.githubusercontent.com", ev: claude-net, to: GitHub, probe: [github.com, raw.githubusercontent.com], why: GitHub 的公共服务，仓库的主人只看得到汇总的访问数 → GitHub}
      - {host: formulae.brew.sh, ev: claude-net, to: 开发下载, probe: [formulae.brew.sh], why: Homebrew 的版本检查 → 开发下载}
      - {host: "*-review.googlesource.com", ev: claude-net, to: Google, probe: [chromium-review.googlesource.com], why: Gerrit 的变更查询（可选），Google 的代码托管 → Google}
      - {host: "fonts.googleapis.com / fonts.gstatic.com", ev: claude-net, to: Google, probe: [fonts.googleapis.com, fonts.gstatic.com], why: Artifact 的字体（可选），Google Fonts → Google}
      - {host: "cdnjs.cloudflare.com / cdn.jsdelivr.net / cdn.tailwindcss.com / code.jquery.com / unpkg.com", ev: claude-net, why: Artifact 用的 JavaScript 库，公共 CDN，全网共用}
      - {host: servd-anthropic-website.b-cdn.net, ev: dlc, to: 国外默认, probe: [servd-anthropic-website.b-cdn.net], why: 上游收录；官网静态资源，位于共享 CDN，未收录（落入国外默认）}

  # ---------- Grok 组：Cursor 与 Grok / xAI（2026-09-30 用户决定合并）----------
  # Cursor 从 2026-09-30 起用 xAI 账号登录，登录链路横跨 x.ai、spacex.ai、grok.com、grokusercontent.com、grokipedia.com，
  # 放在同一组里，改地区时登录不会被拆到不同出口。xai 服务定义在下面“其他 AI”一段之后，组同样是 Grok。
  - id: cursor
    group: Grok
    title: Cursor 编辑器、Agent、CLI、索引、更新
    upstream: {dlc: [cursor]}
    rules:
      - {suffix: cursor.sh, ev: cursor-net, note: api2/api3/api4/api5、repo42、认证等}
      - {suffix: cursor-cdn.com, ev: cursor-net}
      - {suffix: cursorapi.com, ev: cursor-net, note: 扩展市场}
      - {suffix: cursor.com, ev: dlc, note: 官方网络文档只列了其中的 downloads.cursor.com（客户端更新）；整段后缀依据上游 dlc cursor 列表，子域都属于 Cursor（官网、控制台、登录跳转、文档）}
      - {domain: anysphere-binaries.s3.us-east-1.amazonaws.com, ev: cursor-net, note: 专属存储桶；不收整个 amazonaws.com}
      - {suffix: spacex.ai, ev: cursor-signin, note: 9 月 30 日起的登录地址 accounts.spacex.ai 及相关认证主机；Cursor 登录文档当时建议整段放行 *.spacex.ai（企业网络页 2026-11-18 仍列着 accounts.spacex.ai）}
      - {suffix: spacexsi.com, ev: cursor-signin, note: 登录页换成 accounts.spacexsi.com，旧页面 11 月 30 日停用以后必须走它；登录文档建议整段放行 *.spacexsi.com（2026-11-18 第三份全项目复核 F02）}
      - {domain: agent-stores.s3.us-east-1.amazonaws.com, ev: cursor-net, note: 桌面版同步 skills 和 agent 文件；专属存储桶，不收整个 amazonaws.com}
      - {domain: agent-stores.s3.amazonaws.com, ev: cursor-net, note: 同上（不带区域的写法）}
      - {domain: cursor.blob.core.windows.net, ev: cursor-net, note: 给 Windows 远程主机下载 Remote SSH 服务端；专属存储，不收整个 windows.net}
    shared_excluded:
      - {host: "*.cursorvm.com", ev: cursor-net, to: 远程控制, probe: [abc.cursorvm.com], why: Grok Bot 托管计算机，归“远程控制”组（见 remote_control）}

  - id: remote_control
    group: 远程控制
    title: Grok Bot 托管计算机（Cursor）
    rules:
      - {suffix: cursorvm.com, ev: cursor-net, note: "官方：*.cursorvm.com 与 *.*.cursorvm.com 都需要；后缀规则覆盖任意层级子域"}
    notes: >
      Grok Bot 托管计算机按需求第八节单独归“远程控制”，不并入 Grok 组；官方文档表明它使用 Cursor 的 *.cursorvm.com。
      控制入口可以走本组，但远程执行机自己访问模型厂商的连接发生在执行机上，本机规则无法控制。
      直连可用性未实测，默认不设 DIRECT。

  - id: google_ai
    group: Google AI
    title: Gemini、AI Studio、Antigravity、Gemini CLI / Code Assist、NotebookLM、Jules、Labs、DeepMind
    upstream: {dlc: [google-deepmind]}
    rules:
      - {domain: gemini.google.com, ev: dlc}
      - {suffix: gemini.google, ev: dlc, note: Gemini 官方介绍站}
      - {suffix: gemini.gstatic.com, ev: dlc, note: Gemini 静态资源；gstatic.com 其余归 Google}
      - {suffix: geller-pa.googleapis.com, ev: dlc, note: 上游归入 Generative Language API 段}
      - {suffix: proactivebackend-pa.googleapis.com, ev: dlc, note: 上游归入 Generative Language API 段}
      - {suffix: robinfrontend-pa.googleapis.com, ev: dlc, note: 上游归入 Generative Language API 段}
      - {domain: aistudio.google.com, ev: dlc}
      - {suffix: ai.studio, ev: dlc, note: AI Studio 短域名}
      - {suffix: generativeai.google, ev: dlc}
      - {domain: alkalimakersuite-pa.clients6.google.com, ev: dlc, note: AI Studio 后端}
      - {domain: alkalicore-pa.clients6.google.com, ev: dlc, note: AI Studio 后端}
      - {domain: webchannel-alkalimakersuite-pa.clients6.google.com, ev: dlc, note: AI Studio 后端}
      - {domain: makersuite.google.com, ev: dlc}
      - {domain: bard.google.com, ev: dlc, note: 旧入口}
      - {suffix: ai.google.dev, ev: gemini-api, note: Gemini API 文档站}
      - {domain: generativelanguage.googleapis.com, ev: gemini-api, note: Gemini API 端点}
      - {domain: cloudaicompanion.googleapis.com, ev: gca-net, note: Gemini Code Assist 主接口}
      - {domain: cloudcode-pa.googleapis.com, ev: gca-net, note: Code Assist IDE 接口；Gemini CLI / Antigravity 亦使用（社区观察，待实测）}
      - {domain: daily-cloudcode-pa.googleapis.com, ev: dlc, note: 上游归入 Gemini Code Assist 段；官方清单未列（2026-09-23 复核）}
      - {suffix: aicode.googleapis.com, ev: dlc, note: Android Studio Gemini}
      - {suffix: aida.googleapis.com, ev: dlc, note: Android Studio Gemini}
      - {suffix: antigravity.google, ev: dlc, note: Antigravity 官网与下载}
      - {domain: antigravity-pa.googleapis.com, ev: dlc, note: Antigravity}
      - {domain: antigravity.googleapis.com, ev: dlc, note: Antigravity}
      - {suffix: antigravity-unleash.goog, ev: dlc, note: Antigravity}
      - {domain: notebooklm.google.com, ev: dlc}
      - {suffix: notebooklm.google, ev: dlc}
      - {domain: notebooklm-pa.googleapis.com, ev: dlc}
      - {domain: notebooklm.googleapis.com, ev: dlc}
      - {suffix: notebook.google, ev: dlc}
      - {suffix: notebook.google.com, ev: dlc}
      - {suffix: jules.google, ev: dlc, note: Jules}
      - {suffix: jules.google.com, ev: dlc}
      - {suffix: labs.google, ev: dlc, note: Google Labs AI 实验产品}
      - {suffix: labs.google.com, ev: dlc}
      - {suffix: aisandbox-pa.googleapis.com, ev: dlc, note: Google Labs}
      - {suffix: flow.google, ev: dlc, note: Flow}
      - {suffix: flow.google.com, ev: dlc}
      - {suffix: opal.google, ev: dlc, note: Opal}
      - {suffix: opal.google.com, ev: dlc}
      - {suffix: stitch.withgoogle.com, ev: dlc, note: Stitch；withgoogle.com 其余归 Google}
      - {suffix: deepmind.com, ev: dlc}
      - {suffix: deepmind.google, ev: dlc}
    shared_excluded:
      - {host: "oauth2.googleapis.com / accounts.google.com", ev: gca-net, to: Google, probe: [oauth2.googleapis.com, accounts.google.com], why: Google 共享登录与令牌 → Google}
      - {host: "serviceusage / cloudresourcemanager / people / apihub.googleapis.com", ev: gca-net, to: Google, probe: [serviceusage.googleapis.com, cloudresourcemanager.googleapis.com, people.googleapis.com, apihub.googleapis.com], why: 共享 Google Cloud 接口 → Google}
      - {host: "firebaselogging-pa / feedback-pa.googleapis.com", ev: gca-net, to: Google, probe: [firebaselogging-pa.googleapis.com, feedback-pa.googleapis.com], why: 共享遥测与反馈 → Google}
      - {host: "lh3 / lh5.googleusercontent.com", ev: gca-net, to: Google, probe: [lh3.googleusercontent.com, lh5.googleusercontent.com], why: 用户头像，共享 → Google}

  - id: github_copilot
    group: Copilot
    title: GitHub Copilot
    upstream: {dlc: [github-copilot]}
    rules:
      - {suffix: githubcopilot.com, ev: ghcopilot-net, note: 含 individual / business / enterprise 计划接口}
      - {domain: copilot-proxy.githubusercontent.com, ev: ghcopilot-net}
      - {domain: origin-tracker.githubusercontent.com, ev: ghcopilot-net}
      - {domain: copilot-telemetry.githubusercontent.com, ev: ghcopilot-net, note: 官方放行清单列出；上游广告集合会拦截，已加入误杀例外}
      - {domain: copilot-reports.github.com, ev: ghcopilot-net}
      # 网页上 Copilot 的实时连接（Azure Web PubSub 的 WebSocket）：官方放行清单列出这 7 个完整主机，并说不要放行整个 *.webpubsub.azure.com；
      # 所以只收这 7 个，不收后缀（2026-11-18 全项目复核 F04：以前没收，网页实时连接走“国外默认”，不跟 Copilot 选的出口）
      - {domain: production-copilot-host.webpubsub.azure.com, ev: ghcopilot-net}
      - {domain: production-copilot-host-centralus.webpubsub.azure.com, ev: ghcopilot-net}
      - {domain: production-copilot-host-centralus-02.webpubsub.azure.com, ev: ghcopilot-net}
      - {domain: production-copilot-host-eastasia.webpubsub.azure.com, ev: ghcopilot-net}
      - {domain: production-copilot-host-austriaeast.webpubsub.azure.com, ev: ghcopilot-net}
      - {domain: production-copilot-host-westus.webpubsub.azure.com, ev: ghcopilot-net}
      - {domain: production-copilot-host-westus3.webpubsub.azure.com, ev: ghcopilot-net}
      - {domain: copilot-workspace.githubnext.com, ev: dlc}
      - {domain: copilotprodattachments.blob.core.windows.net, ev: dlc, note: 专属存储主机；不收整个 windows.net}
    shared_excluded:
      - {host: "github.com/login/*、github.com/copilot/*", ev: ghcopilot-net, to: GitHub, probe: [github.com], why: 与 GitHub 共用主机，只能按路径区分，统一归 GitHub}
      - {host: "api.github.com/copilot_internal/*", ev: ghcopilot-net, to: GitHub, probe: [api.github.com], why: 与 GitHub API 共用主机，统一归 GitHub}
      - {host: collector.github.com, ev: ghcopilot-net, to: GitHub, probe: [collector.github.com], why: GitHub 通用分析遥测 → GitHub；官方放行清单列出，已加入误杀例外}
      - {host: default.exp-tas.com, ev: ghcopilot-net, to: 国外默认, probe: [default.exp-tas.com], why: 微软实验分配服务，VS Code 等共用 → 国外默认}
      - {host: "copilot-reports-*.b01.azurefd.net / usagereports*.blob.core.windows.net", ev: ghcopilot-net, why: 用量报表下载的备用地址，只有通配形式、位于共享云，不收}
      - {host: copilot-telemetry-service.githubusercontent.com, ev: dlc, to: 广告拦截, probe: [copilot-telemetry-service.githubusercontent.com], why: 上游标为 @ads，官方放行清单未列，按跟踪统计拦截（见 adblock.yaml）}

  - id: microsoft_copilot
    group: Copilot
    title: Microsoft Copilot
    upstream: {dlc: [category-ai-!cn]}
    rules:
      - {suffix: copilot.microsoft.com, ev: dlc}
      - {suffix: copilot.cloud.microsoft, ev: dlc}
      - {suffix: copilot.com, ev: dlc}
      - {domain: sydney.bing.com, ev: maintainer, note: Copilot 对话后端；上游只把 bing.com 整体归 Bing}

