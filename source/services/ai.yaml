      - {domain: qianwen.aliyun.com, ev: dlc, note: 通义千问旧入口}
      - {suffix: tongyi.com, ev: dlc, note: 通义（国内版）；上游“通义千问”一段共 7 条，国内版 5 条在这里，国际版 2 条见 qwen_intl}
      - {suffix: qianwen.com, ev: dlc, note: 千问（国内版）}
      - {suffix: qianwenai.com, ev: dlc, note: 千问（国内版）}
      - {domain: yuanbao.tencent.com, ev: dlc, note: 腾讯元宝}
      - {domain: yiyan.baidu.com, ev: dlc, note: 文心一言}
