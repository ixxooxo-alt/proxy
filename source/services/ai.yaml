      在 Loon / Quantumult X 上要解析到国内 IP 才会直连。通义千问国际版（qwen.ai、qwenlm.ai）不在这里，见 qwen_intl。

  # ---------- Qwen 国际版：用户决定走国外默认（2026-10-04） ----------
  # 起因（2026-10-03 GPT 审核 F01）：以前只在上面的“排除”说明里写了“qwen.ai 落入国外默认”，没有写成规则。
  # 上游的国内域名集合（MetaCubeX geosite 的 cn、SagerNet 的 geosite-cn）都收了 qwen.ai 和 qwenlm.ai，
  # 所以在 mihomo / sing-box 上它实际走的是国内直连。现在写成显式规则，四端都排在国内域名集合之前。
  - id: qwen_intl
    group: 国外默认
    title: Qwen 国际版（通义千问国际版）——用户决定走国外默认
    upstream: {dlc: [category-ai-cn]}
    rules:
      - {suffix: qwen.ai, ev: dlc, note: 含 chat.qwen.ai。域名归属依据上游“通义千问”一段；去向是用户 2026-10-04 的决定，与上游把它归国内不同}
      - {suffix: qwenlm.ai, ev: dlc, note: 国际版较早使用的域名（chat.qwenlm.ai）；同上}
    notes: >
      只管这两个域名本身。页面可能还会用到阿里系共用的静态资源与存储域名（alicdn.com、aliyuncs.com 等）：
      它们是很多国内服务共用的根域，没有收进这里，仍随国内域名集合直连；Qwen 国际版实际用到哪些主机没有实测。
