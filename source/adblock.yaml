# HTTPDNS：不等于广告。是否拦截取决于实际用途、应用能否回退到系统 DNS、拦截后是否可用。
# 目前没有经过验证的条目，默认不启用。
httpdns:
  enabled: false
  entries: []

# 误杀例外：在所有客户端里排在广告拦截之前，按“没有广告规则时本应去的业务目标”放行。
#   target 省略：由生成器按产品规则推导（例如 s.youtube.com → YouTube）
#   target 显式：该主机不属于任何产品规则时必须写明（例如共享的第三方服务 → 国外默认）
# 禁止所有例外统一 DIRECT。
exceptions:
  - {suffix: ct.sendgrid.net, target: 国外默认, ev: openai-net, why: 注册 / 验证邮件里的链接跳转；OpenAI 官方放行清单列出}
  - {suffix: app.link, target: 国外默认, ev: maintainer, why: Branch 深度链接，多个应用的登录 / 魔法链接依赖}
  - {domain: m.stripe.network, target: 国外默认, ev: maintainer, why: Stripe 结账风控信号，拦截会导致支付失败}
  - {domain: m.stripe.com, target: 国外默认, ev: maintainer, why: 同上}
  - {domain: challenges.cloudflare.com, target: 国外默认, ev: openai-net, why: Cloudflare 人机验证}
  - {suffix: hcaptcha.com, target: 国外默认, ev: maintainer, why: 人机验证}
  - {domain: s.youtube.com, ev: maintainer, why: YouTube 播放统计；部分广告集合会拦截，影响观看记录}
  - {domain: copilot-telemetry.githubusercontent.com, ev: ghcopilot-net, why: Copilot 客户端遥测；GitHub 官方放行清单列出，上游广告集合（@ads）会拦截}
  - {suffix: collector.github.com, ev: ghcopilot-net, why: GitHub 分析遥测；Copilot 官方放行清单列出（collector.github.com/*），上游广告集合（@ads）会拦截}
  - {suffix: graph.instagram.com, ev: meta-ig-api, why: Instagram 官方 API 主机（发消息、发内容等都走它），不只是统计上报；上游广告集合（@ads）会拦截（2026-09-30 审核 F05）}

# 复写 / 脚本 / MITM：本版本不内置。
# - 需要设备上生成并信任证书，本项目不预装、不共享、不写入任何证书或私钥。
# - 第三方脚本未审计。可在 Loon 的 [Plugin]、QX 的 [rewrite_remote] 自行添加（例如可莉的去广告插件）。
# - mihomo / sing-box 没有等效的复写脚本能力，不宣称完整复制可莉的去广告效果。
rewrite_mitm: none
