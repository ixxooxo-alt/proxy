# 去广告：底层分别维护（广告 / 跟踪统计 / HTTPDNS / 误杀例外 / 复写脚本 MITM）
#
# 匹配阶段（语义）：局域网例外 → 误杀例外（按业务目标放行）→ 广告与跟踪拦截 → 产品规则 → …
# 各端差异（生成器自动处理，详见 docs/06-已知限制.md）：
#   mihomo / sing-box：严格按书写顺序，可以完全按上面的语义排列。
#   Loon：本地规则 > 插件规则 > 订阅规则；Quantumult X：本地 > 远程。
#         远程广告集合排在本地产品规则之后，所以“位于产品根域下的广告主机”只有列在下面 local_ads /
#         local_tracking 里的那部分能被拦截。

remote_lists:
  mihomo:
    - {kind: geosite, value: category-ads-all, source: "MetaCubeX meta-rules-dat geosite.dat（源自 domain-list-community）"}
  singbox:
    - {kind: rule_set, tag: geosite-category-ads-all,
       url: "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-category-ads-all.srs",
       source: "SagerNet sing-geosite（源自 domain-list-community）"}
  loon:
    - {url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/AdvertisingLite/AdvertisingLite.list",
       tag: 广告拦截-AdvertisingLite, ev: bm7,
       source: "blackmatrix7 AdvertisingLite（2026-09-23 抓取文件头：38,068 条，更新于 2025-12-08）"}
  quantumultx:
    - {url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AdvertisingLite/AdvertisingLite.list",
       tag: 广告拦截-AdvertisingLite, ev: bm7,
       source: "blackmatrix7 AdvertisingLite（2026-09-23 抓取文件头：38,066 条，更新于 2025-12-08）"}

# 自有拦截条目：主要用于“位于产品根域下的广告 / 跟踪主机”，保证 Loon / QX 也能先于产品规则拦截。
# ev: dlc 的条目来自固定快照里 category-ads-all 展开后、落在本项目产品规则范围内的全部条目
# （tools/check_upstream_evidence.py 会检查“一条都不漏”：每条要么在这里，要么在下面的误杀例外里）。
# 上游写法是 domain:（含子域）的用 suffix，full:（精确）的用 domain，与 mihomo / sing-box 的拦截范围一致。
