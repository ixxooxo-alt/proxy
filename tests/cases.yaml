# sing-box 拨号时的解析（2026-10-04 审核 r9 的 F02）。普通的 DNS 查询走 dns.rules；节点连接自己的服务器、直连出站连接
# 域名形式的目标时，解析走的是另一条路：出站自己的 domain_resolver，没有的话用 route.default_domain_resolver（国内 DoH），
# 不看 dns.rules。期望按设计人工写出：局域网里的名字交给系统 DNS（dns-local），公网名字照旧交给国内 DNS（dns-cn）。
#   kind: node    一个节点，服务器地址是 server；expect 是“连这个节点时，server 这个名字交给哪个 DNS 服务器解析”
#   kind: direct  一个域名形式的目标 host，按规则走直连；expect 是“直连之前，这个名字交给哪个 DNS 服务器解析”
# tests/test_dns_lan.py 静态检查生成的配置里有对应的字段；tools/check_real_routes.py 另用官方内核实际拨号核对
# （拨号过程保留，DNS 换成本机替身、所有名字都答 127.0.0.1，所以不会连到本机以外），结果记在快照里。
#
# 2026-10-06 加了两类（“国外的连接，名字不要让国内 DNS 看到”）。看的是内核处理这个连接的全过程里，这个名字被哪个 DNS 替身收到过：
#   kind: proxied   有规则、走代理组的域名；expect: none = 三个替身都没有收到关于它的查询（规则判断时不解析，连接交给代理）
#   kind: unlisted  没有被任何域名规则接住的域名；expect: dns-foreign = 为了判断后面的国内 IP 规则要解析一次，只问境外 DNS
# 这两类加上“直连公网域名”那条对照，另外在“境外 DNS 替身只收不答”的条件下重跑一遍（每个连接保持 14 秒，比内核的 DNS 超时长）：
# 结果必须和正常那一遍相同——境外 DNS 不应答时，内核不会转去问国内 / 系统 DNS。记录在快照的 dial_foreign_silent 里。
# 名字的选法：不用 .example 结尾的（上游的 private 集合把 example 当保留后缀收了），不用容器 hosts 文件里有的名字。
singbox_dial:
  - {kind: node, server: gateway.lan, expect: dns-local, why: 节点的服务器是局域网后缀下的名字（审核方的例子）}
  - {kind: node, server: proxy.home.arpa, expect: dns-local, why: 审核方的另一个例子}
  - {kind: node, server: homeproxy, expect: dns-local, why: 不带点的主机名也只有局域网里的 DNS 认识}
  - {kind: node, server: node.example.com, expect: dns-cn, why: 公网域名的节点照旧由国内 DNS 解析（有意的设计）}
  - {kind: node, server: lan.example.com, expect: dns-cn, why: "只是名字里有 lan，不是局域网后缀"}
  - {kind: direct, host: nas.lan, expect: dns-local, why: 域名形式的局域网目标：直连之前先用系统 DNS 解析}
  - {kind: direct, host: www.baidu.com, expect: dns-cn, why: 国内直连的公网域名：直连出站用默认解析器}
  - {kind: proxied, host: www.youtube.com, expect: none, why: "有产品规则、走代理组：规则判断时不解析"}
  - {kind: proxied, host: gemini.google.com, expect: none}
  - {kind: proxied, host: chat.qwen.ai, expect: none, why: "在上游的国内域名集合里，但排在前面的显式规则把它交给国外默认：不解析，国内 DNS 看不到它"}
  - {kind: unlisted, host: never-listed-site.org, expect: dns-foreign, why: "虚构的名字，没有被任何域名规则接住：路由里的 resolve 动作只问境外 DNS"}
  - {kind: unlisted, host: r1.test.dnsleaktest.com, expect: dns-foreign, why: "DNS 泄露测试网站用的那一类随机子域名"}

