  - {kind: node, server: lan.example.com, expect: domestic, why: "只是名字里有 lan，不是局域网后缀"}
  - {kind: direct, host: nas.lan, expect: system, why: "域名形式的局域网目标：直连出口的解析跟随 nameserver-policy（2026-09-30 审核 F04 的修正）"}
