# 路由期望：由需求与官方资料独立写出，不从生成结果反推。
# expect：策略组名 / DIRECT / 广告拦截；per_client：各端语义不同时的覆盖值（必须写明原因）。
#   per_client 的键是四类客户端：mihomo、singbox、loon、quantumultx。Loon / Quantumult X 另有严格版（2026-10-06），
#   键是 loon-strict、quantumultx-strict：只管严格版那一份产物；没写的话，严格版跟同一个 App 的标准版走
#   （查找顺序：per_client[严格版的键] → per_client[loon / quantumultx] → expect）。
# 字段 host 表示按域名连接，ip 表示直接 IP 连接。
#
# 每个用例跑两遍（2026-10-03 审核 F01 之后）：
#   1. 远程集合用 tests/fixtures.yaml 的样本（tests/test_routing.py）：检查先后顺序这类语义；
#   2. 远程集合用真实上游数据的成员快照 tests/data/real_sets.json（tests/test_real_data.py）：检查真实数据下最后交给谁。
#      mihomo / sing-box 另由 tools/check_real_routes.py 用官方内核实际跑一遍，结果也记在快照里。
# synthetic: true 的用例只跑第 1 遍：它用一个虚构的主机说明语义，真实集合里没有这个主机。
# 没有命中任何域名规则的主机，结果取决于解析到的 IP；两遍用的都是 fixtures.yaml 里假定的解析结果（没列出的按境外 IP 算）。

