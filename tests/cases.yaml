# 必须属于下面列出的已知类别。全集怎么扫的见 tools/dns_route_consistency.py；扫描结果连同官方内核的抽查记在快照的
# consistency 里，tests/test_real_data.py 逐个核对：每个不一致的主机都能归到某一类，每一类都确实还有主机（没有了就该删掉）。
# 这些都是现状的记录，不是“应该这样”——标准版这一轮没有改，怎么处理列在 docs/06 的待决事项里。
#   kind: real_ip     名字在“要真实地址的名单”里（source/project.yaml 的 dns.real_ip），路由没有把它固定为直连
#   kind: private     名字来自上游的 private 集合（保留后缀、反向解析域、路由器登录域名），路由没有把它固定为直连
#   kind: product_cn  上游的国内域名集合收了它，路由靠排在前面的产品规则把它交给代理组
dns_route_consistency:
  singbox:
    - {kind: real_ip, why: "DNS 规则第二条把要真实地址的名单整个交给 dns-cn；其中 time.windows.com 路由归 Microsoft 组，pool.ntp.org 落到国外默认，icitymobile.mobi 没有域名规则、按解析到的 IP 决定。待决事项 15"}
  mihomo:
    - {kind: private, why: "nameserver-policy 的 geosite:cn,private 把 private 集合也交给国内 DNS，fake-ip-filter 又让它们拿真实地址；路由上只有局域网后缀固定直连，其余按解析到的 IP 决定。待决事项 14"}
    - {kind: product_cn, why: "nameserver-policy 里没有“走代理组的产品域名”这一层（sing-box 的 DNS 规则里有）。只影响地址以外的查询类型：A 查询给假地址，AAAA / HTTPS 回空应答，连接本身不解析。待决事项 16"}

# 开启 / 关闭广告规则前后出口必须一致的例外主机
exception_consistency:
