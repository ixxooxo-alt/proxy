manual_only:
  - {name: "日本 美国 01", groups: [jp, us]}
  - {name: "日本-美国 01", groups: [jp, us]}
  - {name: "🇯🇵🇺🇸 01", groups: [jp, us]}
  - {name: "日本 > 美国 01", groups: [jp, us]}
  - {name: "香港中转 日本中转 01", groups: [hk, jp]}
  - {name: "🇺🇸 美国 → 香港中转", groups: [hk, us]}
  - {name: "Avia 日本 美国 01", groups: [jp, us]}      # Avia 里的 via 不算“经由”，两个地区都像落地
  # 2026-10-04
  - {name: "🇯🇵 Tokyo 01 🇺🇸", groups: [jp, us]}
  - {name: "美国 奥克兰 01", groups: [us]}             # 国名 + 别国的城市词（奥克兰也指新西兰 Auckland）：按国名，但不进自动
  - {name: "美国 都柏林 01", groups: [us]}
  - {name: "US Dublin 01", groups: [us]}
  - {name: "US Manchester 01", groups: [us]}
  - {name: "日本 伦敦 01", groups: [jp]}
  - {name: "日本 01 [解锁: 美国] 新加坡", groups: [jp, sg]}   # 右括号之后的“新加坡”不在解锁说明里
  # 香港的国名 + 别的地区只有城市词：城市词可能只是宣传语里的字眼，香港不让位，两边都只进手动（审核 F05）
  - {name: "香港 01 纽约时报", groups: [hk, us]}
  - {name: "香港 01 | 洛杉矶时报", groups: [hk, us]}
  - {name: "香港-东京 01", groups: [hk, jp]}
  - {name: "HK-Tokyo 01", groups: [hk, jp]}
  - {name: "HK 01 Osaka", groups: [hk, jp]}
  - {name: "香港 首尔 01", groups: [hk, kr]}
  # 2026-10-04 审核 r9 的 F01：名字里只提到一个地区，而那个词不在落地位置。仍进这个地区的手动组（方便手选），
  # 但不进它的自动 / 故障转移 / 负载均衡：“能解锁美国内容”不等于出口在美国，“日本中转”也没说最后从哪里出去。
  # 前三个是审核方给的反例；其余是原来放在 expect 里的 9 个（当时按“只提到一个地区就算它”写的期望）和我按同样思路补的。
