  # 规则在这里有意从严，认不准就不进自动；确定落地的在 local.yaml 的 node_names.assign 里指定。
  - {name: "IEPL 01 Unlock US", groups: [us]}
  - {name: "Premium 01 | 解锁美国", groups: [us]}
  - {name: "日本中转 01", groups: [jp]}
  - {name: "香港中转 01", groups: [hk]}
