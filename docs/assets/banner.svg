<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">proxy-routing</title>
  <desc id="d">一份规则源，生成 Loon、Quantumult X、mihomo、sing-box、Stash 五个客户端的分流配置</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#13234a"/>
      <stop offset="1" stop-color="#1b3a7a"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
    <!-- 左边：名字和一句话 -->
    <text x="72" y="150" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="-1">proxy-routing</text>
    <text x="74" y="206" fill="#c7d2fe" font-size="30" font-weight="600">一份规则源 · 五个客户端</text>
    <text x="74" y="246" fill="#94a3b8" font-size="21">One rule source · Five clients · Every rule sourced</text>
    <g font-size="17" font-weight="600">
      <rect x="74" y="286" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="140" y="309" fill="#e2e8f0" text-anchor="middle">国内直连</text>
      <rect x="218" y="286" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="293" y="309" fill="#e2e8f0" text-anchor="middle">每条规则有出处</text>
      <rect x="380" y="286" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="442" y="309" fill="#e2e8f0" text-anchor="middle">开源可核对</text>
    </g>

    <!-- 右边：一份规则源 → 五个客户端 -->
    <g fill="none" stroke="url(#line)" stroke-width="2.5">
      <path d="M856 200 C 930 200, 930 72, 1004 72"/>
      <path d="M856 200 C 930 200, 930 136, 1004 136"/>
      <path d="M856 200 L 1004 200"/>
      <path d="M856 200 C 930 200, 930 264, 1004 264"/>
      <path d="M856 200 C 930 200, 930 328, 1004 328"/>
    </g>
    <rect x="700" y="160" width="156" height="80" rx="18" fill="url(#src)"/>
    <text x="778" y="196" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">source/</text>
    <text x="778" y="224" fill="#e0e7ff" font-size="16" text-anchor="middle">一份规则源</text>
    <g font-size="20" font-weight="600">
      <rect x="1004" y="50" width="204" height="44" rx="22" fill="#0f172a" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.6"/>
      <text x="1106" y="79" fill="#ffffff" text-anchor="middle">Loon</text>
      <rect x="1004" y="114" width="204" height="44" rx="22" fill="#0f172a" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.6"/>
      <text x="1106" y="143" fill="#ffffff" text-anchor="middle">Quantumult X</text>
      <rect x="1004" y="178" width="204" height="44" rx="22" fill="#0f172a" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.6"/>
      <text x="1106" y="207" fill="#ffffff" text-anchor="middle">mihomo · Clash</text>
      <rect x="1004" y="242" width="204" height="44" rx="22" fill="#0f172a" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.6"/>
      <text x="1106" y="271" fill="#ffffff" text-anchor="middle">sing-box</text>
      <rect x="1004" y="306" width="204" height="44" rx="22" fill="#0f172a" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.6"/>
      <text x="1106" y="335" fill="#ffffff" text-anchor="middle">Stash</text>
    </g>
  </g>
</svg>
